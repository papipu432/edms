{% extends "base.html" %}
{% block title %}Workflow Builder - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Workflow Builder</h1>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Create New Chain -->
    <div>
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Create Approval Chain</h2>
            <form id="chain-form" onsubmit="saveChain(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Chain Name</label>
                    <input type="text" id="chain-name" class="w-full border rounded px-3 py-2 text-sm" required>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Folder ID (optional)</label>
                        <input type="number" id="chain-folder-id" class="w-full border rounded px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Template ID (optional)</label>
                        <input type="number" id="chain-template-id" class="w-full border rounded px-3 py-2 text-sm">
                    </div>
                </div>
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-medium text-gray-700">Steps</label>
                        <button type="button" onclick="addStep()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200"
                            hx-get="/workflow-builder" hx-swap="none">+ Add Step</button>
                    </div>
                    <div id="steps-container" class="space-y-2">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 text-sm font-medium">Save Chain</button>
            </form>
            <div id="form-message" class="mt-3 text-sm hidden"></div>
        </div>
    </div>
    <!-- Existing Chains -->
    <div>
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Existing Approval Chains</h2>
            <div id="chains-list" class="space-y-3">
                <p class="text-sm text-gray-500">Loading...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let stepCount = 0;

function addStep() {
    stepCount++;
    const container = document.getElementById('steps-container');
    const stepHtml = `
        <div class="border rounded p-3 bg-gray-50" id="step-${stepCount}">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-medium text-gray-600">Step ${stepCount}</span>
                <button type="button" onclick="removeStep(${stepCount})" class="text-xs text-red-600 hover:text-red-800">Remove</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Role Code</label>
                    <input type="text" class="step-role w-full border rounded px-2 py-1 text-xs" placeholder="reviewer">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Type</label>
                    <select class="step-type w-full border rounded px-2 py-1 text-xs">
                        <option value="sequential">Sequential</option>
                        <option value="parallel">Parallel</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Timeout (hrs)</label>
                    <input type="number" class="step-timeout w-full border rounded px-2 py-1 text-xs" placeholder="24">
                </div>
            </div>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', stepHtml);
}

function removeStep(id) {
    const el = document.getElementById('step-' + id);
    if (el) el.remove();
}

async function saveChain(event) {
    event.preventDefault();
    const name = document.getElementById('chain-name').value;
    const folderId = document.getElementById('chain-folder-id').value || null;
    const templateId = document.getElementById('chain-template-id').value || null;

    const stepElements = document.querySelectorAll('#steps-container > div');
    const steps = [];
    let order = 1;
    stepElements.forEach(el => {
        const role = el.querySelector('.step-role').value || null;
        const type = el.querySelector('.step-type').value;
        const timeout = el.querySelector('.step-timeout').value || null;
        steps.push({
            step_order: order++,
            approval_type: type,
            role_code: role,
            timeout_hours: timeout ? parseInt(timeout) : null
        });
    });

    if (steps.length === 0) {
        showMessage('Please add at least one step.', 'red');
        return;
    }

    const payload = {
        name: name,
        folder_id: folderId ? parseInt(folderId) : null,
        template_id: templateId ? parseInt(templateId) : null,
        steps: steps
    };

    const resp = await authFetch('/api/approval-chains', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    if (resp.ok) {
        showMessage('Chain created successfully!', 'green');
        document.getElementById('chain-form').reset();
        document.getElementById('steps-container').innerHTML = '';
        stepCount = 0;
        loadChains();
    } else {
        const err = await resp.json();
        showMessage(err.detail || 'Error creating chain', 'red');
    }
}

function showMessage(text, color) {
    const el = document.getElementById('form-message');
    el.textContent = text;
    el.className = `mt-3 text-sm text-${color}-600`;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 3000);
}

async function loadChains() {
    const resp = await authFetch('/api/approval-chains');
    if (!resp.ok) return;
    const chains = await resp.json();
    const list = document.getElementById('chains-list');
    if (chains.length === 0) {
        list.innerHTML = '<p class="text-sm text-gray-500">No approval chains configured yet.</p>';
        return;
    }
    list.innerHTML = chains.map(c => `
        <div class="border rounded-lg p-3 hover:bg-gray-50">
            <div class="flex justify-between items-center">
                <span class="font-medium text-sm">${escapeHtml(c.name)}</span>
                <button onclick="deleteChain(${c.id})" class="text-xs text-red-600 hover:text-red-800">Delete</button>
            </div>
            <div class="text-xs text-gray-500 mt-1">
                ${c.folder_id ? 'Folder: ' + c.folder_id : ''} ${c.template_id ? 'Template: ' + c.template_id : ''}
                ${!c.folder_id && !c.template_id ? 'No scope' : ''}
            </div>
        </div>
    `).join('');
}

async function deleteChain(id) {
    if (!confirm('Delete this approval chain?')) return;
    const resp = await authFetch('/api/approval-chains/' + id, { method: 'DELETE' });
    if (resp.ok) {
        loadChains();
    }
}

// Initial load
addStep();
loadChains();
</script>
{% endblock %}
