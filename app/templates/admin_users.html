{% extends "base.html" %}
{% block title %}Admin - Users - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">User Management</h1>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Users Table -->
    <div class="lg:col-span-2">
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Username</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Roles</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-table" class="divide-y divide-gray-200">
                    <tr><td colspan="5" class="px-4 py-3 text-gray-500">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Create User Form -->
    <div>
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Create User</h2>
            <form id="create-user-form" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" name="username" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md text-sm hover:bg-blue-700">Create User</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const allRoles = ['admin', 'reviewer', 'editor', 'annotator', 'approver'];

async function loadUsers() {
    const resp = await authFetch('/api/users');
    if (!resp.ok) return;
    const users = await resp.json();
    const tbody = document.getElementById('users-table');
    tbody.innerHTML = users.map(u => `
        <tr>
            <td class="px-4 py-3 text-sm">${escapeHtml(u.username)}</td>
            <td class="px-4 py-3 text-sm">${escapeHtml(u.email)}</td>
            <td class="px-4 py-3 text-sm">
                ${u.roles.map(r => `<span class="inline-block bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full mr-1">${escapeHtml(r)}</span>`).join('')}
                <select onchange="assignRole(${u.id}, this.value); this.selectedIndex=0;" class="mt-1 text-xs border rounded px-1 py-0.5">
                    <option value="">+ Add role</option>
                    ${allRoles.filter(r => !u.roles.includes(r)).map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
                </select>
            </td>
            <td class="px-4 py-3 text-sm">${u.is_active ? '<span class="text-green-600">Active</span>' : '<span class="text-red-600">Inactive</span>'}</td>
            <td class="px-4 py-3 text-sm">
                <button onclick="toggleUser(${u.id}, ${!u.is_active})" class="text-xs text-blue-600 hover:underline">${u.is_active ? 'Deactivate' : 'Activate'}</button>
            </td>
        </tr>
    `).join('');
}

async function assignRole(userId, role) {
    if (!role) return;
    await authFetch(`/api/users/${userId}/roles`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ role: role })
    });
    loadUsers();
}

async function toggleUser(userId, activate) {
    await authFetch(`/api/users/${userId}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ is_active: activate })
    });
    loadUsers();
}

document.getElementById('create-user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {
        username: form.username.value,
        email: form.email.value,
        password: form.password.value
    };
    const resp = await authFetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    if (resp.ok) {
        form.reset();
        loadUsers();
    }
});

loadUsers();
</script>
{% endblock %}
