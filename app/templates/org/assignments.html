{% extends "base.html" %}
{% block title %}Assignments - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">User Assignments</h1>
<div id="assignments-list" class="bg-white rounded shadow p-4">
    <p class="text-gray-500">Loading...</p>
</div>
{% endblock %}
{% block scripts %}
<script>
authFetch('/org/api/assignments').then(r=>r.json()).then(data=>{
    const el = document.getElementById('assignments-list');
    if(!data.length){el.innerHTML='<p>No assignments found.</p>';return;}
    el.innerHTML='<table class="w-full"><thead><tr><th class="text-left p-2">User</th><th class="text-left p-2">Type</th><th class="text-left p-2">Primary</th></tr></thead><tbody>'+data.map(a=>'<tr><td class="p-2">'+escapeHtml(a.user_id)+'</td><td class="p-2">'+escapeHtml(a.assignment_type)+'</td><td class="p-2">'+(a.is_primary?'Yes':'No')+'</td></tr>').join('')+'</tbody></table>';
});
</script>
{% endblock %}
