{% extends "base.html" %}
{% block title %}Org Chart - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Organization Chart</h1>
<div id="chart" class="bg-white rounded shadow p-4">
    <p class="text-gray-500">Loading...</p>
</div>
{% endblock %}
{% block scripts %}
<script>
function renderTree(nodes, depth=0) {
    return nodes.map(n => '<div style="margin-left:'+depth*20+'px" class="py-1"><span class="font-medium">'+escapeHtml(n.name)+'</span> <span class="text-gray-400 text-sm">('+escapeHtml(n.code)+')</span>' + (n.children && n.children.length ? renderTree(n.children, depth+1) : '') + '</div>').join('');
}
authFetch('/org/api/chart').then(r=>r.json()).then(data=>{
    document.getElementById('chart').innerHTML = data.length ? renderTree(data) : '<p>No units found.</p>';
});
</script>
{% endblock %}
