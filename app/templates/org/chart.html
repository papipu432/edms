{% extends "base.html" %}
{% block title %}Org Chart - EDMS{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Organization Chart (Drag & Drop)</h1>
    <div class="flex gap-2">
        <button onclick="toggleEditMode()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            ✏️ Edit Mode
        </button>
        <button onclick="refreshChart()" class="bg-gray-200 px-3 py-2 rounded hover:bg-gray-300">
            🔄 Refresh
        </button>
    </div>
</div>

<div id="org-chart-container" class="bg-white rounded shadow p-6 overflow-auto">
    <div id="chart" class="min-w-max"></div>
</div>

<!-- Add Unit Modal -->
<div id="add-unit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
        <h3 class="text-lg font-semibold mb-4">Add Organizational Unit</h3>
        <form id="add-unit-form" onsubmit="handleAddUnit(event)">
            <input type="hidden" id="parent-unit-id">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Parent Unit</label>
                <input type="text" id="parent-unit-name" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100" readonly>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit Code</label>
                <input type="text" id="unit-code" required class="w-full border border-gray-300 rounded-md px-3 py-2">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit Name</label>
                <input type="text" id="unit-name" required class="w-full border border-gray-300 rounded-md px-3 py-2">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Short Name</label>
                <input type="text" id="unit-short-name" class="w-full border border-gray-300 rounded-md px-3 py-2">
            </div>
            
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeAddUnitModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Create</button>
            </div>
        </form>
    </div>
</div>

<style>
.org-tree {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.org-tree ul {
    padding-top: 20px;
    position: relative;
    transition: all 0.5s;
    display: flex;
    justify-content: center;
}

.org-tree li {
    float: left;
    text-align: center;
    list-style-type: none;
    position: relative;
    padding: 20px 5px 0 5px;
    transition: all 0.5s;
}

/* Connectors */
.org-tree li::before, .org-tree li::after {
    content: '';
    position: absolute;
    top: 0;
    right: 50%;
    border-top: 2px solid #ccc;
    width: 50%;
    height: 20px;
}

.org-tree li::after {
    right: auto;
    left: 50%;
    border-left: 2px solid #ccc;
}

.org-tree li:only-child::after, .org-tree li:only-child::before {
    display: none;
}

.org-tree li:only-child {
    padding-top: 0;
}

.org-tree li:first-child::before, .org-tree li:last-child::after {
    border: 0 none;
}

.org-tree li:last-child::before {
    border-right: 2px solid #ccc;
    border-radius: 0 5px 0 0;
}

.org-tree li:first-child::after {
    border-radius: 5px 0 0 0;
}

.org-tree ul ul::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    border-left: 2px solid #ccc;
    width: 0;
    height: 20px;
}

/* Node styling */
.org-node {
    border: 2px solid #e5e7eb;
    padding: 12px 16px;
    text-decoration: none;
    color: #333;
    font-family: sans-serif;
    font-size: 14px;
    display: inline-block;
    border-radius: 8px;
    background: white;
    transition: all 0.3s;
    min-width: 150px;
    cursor: pointer;
    position: relative;
}

.org-node:hover {
    background: #f9fafb;
    border-color: #3b82f6;
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.org-node.dragging {
    opacity: 0.5;
    cursor: grabbing;
}

.org-node.drag-over {
    border-color: #10b981;
    background: #ecfdf5;
    transform: scale(1.05);
}

.org-node-header {
    font-weight: 600;
    margin-bottom: 4px;
}

.org-node-code {
    font-size: 11px;
    color: #6b7280;
}

.org-node-actions {
    position: absolute;
    top: -10px;
    right: -10px;
    display: none;
    gap: 4px;
}

.org-node:hover .org-node-actions {
    display: flex;
}

.action-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-add { background: #10b981; color: white; }
.btn-edit { background: #3b82f6; color: white; }
.btn-delete { background: #ef4444; color: white; }

.edit-mode .org-node {
    cursor: grab;
}

.edit-mode .org-node:active {
    cursor: grabbing;
}
</style>
{% endblock %}

{% block scripts %}
<script>
let orgData = [];
let editMode = false;

document.addEventListener('DOMContentLoaded', () => {
    refreshChart();
});

async function refreshChart() {
    const resp = await authFetch('/org/api/chart');
    if (!resp.ok) return;
    orgData = await resp.json();
    renderChart();
}

function renderChart() {
    const container = document.getElementById('chart');
    if (orgData.length === 0) {
        container.innerHTML = '<p class="text-gray-500">No organizational units. Create the root unit first.</p>';
        return;
    }
    
    container.innerHTML = `
        <div class="org-tree ${editMode ? 'edit-mode' : ''}">
            <ul>
                ${orgData.map(node => renderNode(node)).join('')}
            </ul>
        </div>
    `;
    
    // Initialize drag-drop
    initDragDrop();
}

function renderNode(node, depth = 0) {
    return `
        <li>
            <div class="org-node" 
                 data-unit-id="${node.id}"
                 draggable="${editMode}"
                 ondragstart="handleNodeDragStart(event)"
                 ondragover="handleNodeDragOver(event)"
                 ondragleave="handleNodeDragLeave(event)"
                 ondrop="handleNodeDrop(event, '${node.id}')">
                <div class="org-node-actions">
                    <button class="action-btn btn-add" onclick="openAddUnitModal('${node.id}', '${escapeHtml(node.name)}')" title="Add child">+</button>
                    <button class="action-btn btn-edit" onclick="editUnit('${node.id}')" title="Edit">✏️</button>
                    <button class="action-btn btn-delete" onclick="deleteUnit('${node.id}')" title="Delete">🗑️</button>
                </div>
                <div class="org-node-header">${escapeHtml(node.name)}</div>
                <div class="org-node-code">${escapeHtml(node.code)}</div>
                ${node.head_name ? `<div class="text-xs text-gray-500 mt-1">👤 ${escapeHtml(node.head_name)}</div>` : ''}
            </div>
            ${node.children && node.children.length > 0 ? `
                <ul>
                    ${node.children.map(child => renderNode(child, depth + 1)).join('')}
                </ul>
            ` : ''}
        </li>
    `;
}

// Drag and Drop for reordering
let draggedNode = null;

function handleNodeDragStart(e) {
    if (!editMode) return;
    draggedNode = e.currentTarget;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.setData('text/plain', e.currentTarget.dataset.unitId);
}

function handleNodeDragOver(e) {
    if (!editMode) return;
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function handleNodeDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

async function handleNodeDrop(e, targetId) {
    if (!editMode) return;
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    
    const sourceId = e.dataTransfer.getData('text/plain');
    if (sourceId === targetId) return;
    
    // Move unit - update parent
    const resp = await authFetch(`/org/api/units/${sourceId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parent_id: targetId })
    });
    
    if (resp.ok) {
        refreshChart();
    } else {
        alert('Failed to move unit');
    }
    
    draggedNode = null;
}

function initDragDrop() {
    // Additional initialization if needed
}

function toggleEditMode() {
    editMode = !editMode;
    renderChart();
}

// Add Unit Modal
function openAddUnitModal(parentId, parentName) {
    document.getElementById('parent-unit-id').value = parentId;
    document.getElementById('parent-unit-name').value = parentName;
    document.getElementById('add-unit-modal').classList.remove('hidden');
}

function closeAddUnitModal() {
    document.getElementById('add-unit-modal').classList.add('hidden');
    document.getElementById('add-unit-form').reset();
}

async function handleAddUnit(e) {
    e.preventDefault();
    
    const parentId = document.getElementById('parent-unit-id').value;
    const code = document.getElementById('unit-code').value;
    const name = document.getElementById('unit-name').value;
    const shortName = document.getElementById('unit-short-name').value;
    
    const resp = await authFetch('/org/api/units', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            code,
            name,
            short_name: shortName,
            parent_id: parentId || null
        })
    });
    
    if (resp.ok) {
        closeAddUnitModal();
        refreshChart();
    } else {
        alert('Failed to create unit');
    }
}

async function editUnit(unitId) {
    // Implement edit functionality
    alert('Edit unit: ' + unitId);
}

async function deleteUnit(unitId) {
    if (!confirm('Are you sure you want to delete this unit?')) return;
    
    const resp = await authFetch(`/org/api/units/${unitId}`, {
        method: 'DELETE'
    });
    
    if (resp.ok) {
        refreshChart();
    } else {
        alert('Failed to delete unit');
    }
}
</script>
{% endblock %}
