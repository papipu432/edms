{% extends "base.html" %}
{% block title %}Positions - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Positions</h1>
<div id="positions-list" class="bg-white rounded shadow p-4">
    <p class="text-gray-500">Loading...</p>
</div>
{% endblock %}
{% block scripts %}
<script>
authFetch('/org/api/positions').then(r=>r.json()).then(data=>{
    const el = document.getElementById('positions-list');
    if(!data.length){el.innerHTML='<p>No positions found.</p>';return;}
    el.innerHTML='<table class="w-full"><thead><tr><th class="text-left p-2">Code</th><th class="text-left p-2">Name</th><th class="text-left p-2">Head</th></tr></thead><tbody>'+data.map(p=>'<tr><td class="p-2">'+escapeHtml(p.position_code)+'</td><td class="p-2">'+escapeHtml(p.position_name)+'</td><td class="p-2">'+(p.is_head?'Yes':'No')+'</td></tr>').join('')+'</tbody></table>';
});
</script>
{% endblock %}
