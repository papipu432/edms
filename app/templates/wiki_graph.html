<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Graph</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        #graph-container { width: 100%; height: 600px; border: 1px solid #ccc; background: #fff; }
        .legend { margin-bottom: 15px; display: flex; gap: 20px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 16px; height: 16px; border-radius: 3px; }
        h1 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Wiki Graph</h1>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #3b82f6;"></div>
            <span>Entity</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #10b981;"></div>
            <span>Topic</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #f59e0b;"></div>
            <span>Summary</span>
        </div>
    </div>
    <div id="graph-container"></div>

    <script>
        let network = null;

        async function loadGraph() {
            try {
                const response = await fetch('/api/wiki/graph/data');
                if (!response.ok) {
                    alert('Failed to load wiki graph data');
                    return;
                }
                const data = await response.json();
                renderGraph(data);
            } catch (err) {
                alert('Error loading graph: ' + err.message);
            }
        }

        function renderGraph(data) {
            const nodes = new vis.DataSet(
                data.nodes.map(n => ({
                    id: n.id,
                    label: n.label,
                    color: n.color,
                    title: n.type + ': ' + n.label,
                    shape: 'dot',
                    _path: n.path
                }))
            );

            const edges = new vis.DataSet(
                data.edges.map((e, i) => ({
                    id: i,
                    from: e.source,
                    to: e.target,
                    arrows: 'to'
                }))
            );

            const container = document.getElementById('graph-container');
            const graphData = { nodes: nodes, edges: edges };
            const options = {
                physics: { stabilization: { iterations: 100 } },
                interaction: { hover: true, tooltipDelay: 200, navigationButtons: true },
                edges: { smooth: { type: 'continuous' } },
                nodes: { font: { size: 14 }, size: 16 }
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, graphData, options);

            // Click to navigate to wiki page
            network.on('doubleClick', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.get(nodeId);
                    if (node && node._path) {
                        window.location.href = '/api/wiki/pages/' + node._path;
                    }
                }
            });
        }

        loadGraph();
    </script>
</body>
</html>
