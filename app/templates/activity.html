{% extends "base.html" %}
{% block title %}Activity Feed - EDMS{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold">Activity Feed</h1>
    <p class="text-sm text-gray-500 mt-1">Recent actions across all documents.</p>
</div>
<div id="activity-feed" class="space-y-4 max-w-3xl">
    <p class="text-gray-500">Loading activity...</p>
</div>
<div id="activity-loader" class="py-4 text-center"
     hx-get="/api/activity/feed?offset=0&limit=20"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     hx-headers='{"Authorization": "Bearer " + localStorage.getItem("edms_token")}'>
</div>
{% endblock %}
{% block scripts %}
<script>
let activityOffset = 0;
const activityLimit = 20;
let activityLoading = false;

function getActionIcon(action) {
    const icons = {
        'upload': '<svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>',
        'view': '<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>',
        'download': '<svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>',
        'delete': '<svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'
    };
    return icons[action] || '<svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
}

function renderActivityEntry(entry) {
    return `
        <div class="bg-white rounded-lg shadow p-4 flex items-start gap-3">
            <div class="mt-1">${getActionIcon(entry.action)}</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm">
                    <span class="font-medium">${escapeHtml(entry.actor_username || 'System')}</span>
                    <span class="text-gray-600"> ${escapeHtml(entry.action)}</span>
                    ${entry.document_id ? ' <a href="/documents/' + entry.document_id + '/view" class="text-blue-600 hover:underline">document #' + entry.document_id + '</a>' : ''}
                </p>
                ${entry.details ? '<p class="text-xs text-gray-500 mt-1">' + escapeHtml(typeof entry.details === 'string' ? entry.details : JSON.stringify(entry.details)) + '</p>' : ''}
            </div>
            <span class="text-xs text-gray-400 whitespace-nowrap">${new Date(entry.timestamp).toLocaleString()}</span>
        </div>
    `;
}

async function loadActivity() {
    if (activityLoading) return;
    activityLoading = true;
    const resp = await authFetch('/api/activity/feed?offset=' + activityOffset + '&limit=' + activityLimit);
    if (!resp.ok) {
        activityLoading = false;
        return;
    }
    const data = await resp.json();
    const entries = data.entries || [];
    const feed = document.getElementById('activity-feed');

    if (activityOffset === 0 && entries.length === 0) {
        feed.innerHTML = '<p class="text-gray-500">No activity yet.</p>';
        document.getElementById('activity-loader').remove();
        activityLoading = false;
        return;
    }

    if (activityOffset === 0) {
        feed.innerHTML = '';
    }

    entries.forEach(entry => {
        feed.insertAdjacentHTML('beforeend', renderActivityEntry(entry));
    });

    activityOffset += entries.length;

    if (entries.length < activityLimit) {
        const loader = document.getElementById('activity-loader');
        if (loader) loader.remove();
    }
    activityLoading = false;
}

// Infinite scroll using Intersection Observer
const loader = document.getElementById('activity-loader');
if (loader) {
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            loadActivity();
        }
    });
    observer.observe(loader);
}

// WebSocket for real-time updates
function connectActivityWs() {
    if (!token) return;
    try {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/ws/notifications?token=' + token);
        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'activity' || data.action) {
                    const feed = document.getElementById('activity-feed');
                    feed.insertAdjacentHTML('afterbegin', renderActivityEntry(data));
                }
            } catch (e) { /* ignore */ }
        };
        ws.onclose = function() {
            setTimeout(connectActivityWs, 5000);
        };
    } catch (e) { /* ignore */ }
}

loadActivity();
connectActivityWs();
</script>
{% endblock %}
