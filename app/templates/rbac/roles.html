{% extends "base.html" %}
{% block title %}Roles - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Roles</h1>
<div id="roles-list" class="bg-white rounded shadow p-4">
    <p class="text-gray-500">Loading...</p>
</div>
{% endblock %}
{% block scripts %}
<script>
authFetch('/rbac/api/roles').then(r=>r.json()).then(data=>{
    const el = document.getElementById('roles-list');
    if(!data.length){el.innerHTML='<p>No roles found.</p>';return;}
    el.innerHTML='<table class="w-full"><thead><tr><th class="text-left p-2">Code</th><th class="text-left p-2">Name</th><th class="text-left p-2">System</th><th class="text-left p-2">Permissions</th></tr></thead><tbody>'+data.map(r=>'<tr><td class="p-2">'+escapeHtml(r.code)+'</td><td class="p-2">'+escapeHtml(r.name)+'</td><td class="p-2">'+(r.is_system?'Yes':'No')+'</td><td class="p-2">'+r.permissions.length+'</td></tr>').join('')+'</tbody></table>';
});
</script>
{% endblock %}
