{% extends "base.html" %}
{% block title %}Workflow - EDMS{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Review &amp; Approval Workflow</h1>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Document Queue -->
    <div>
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Document Queue</h2>
            <div id="doc-queue" class="space-y-3">
                <p class="text-sm text-gray-500">Loading...</p>
            </div>
        </div>
    </div>
    <!-- Workflow History -->
    <div>
        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="text-lg font-semibold mb-4">Workflow History</h2>
            <div id="workflow-history" class="space-y-2">
                <p class="text-sm text-gray-500">Select a document to view history</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let selectedDocId = null;

async function loadQueue() {
    const resp = await authFetch('/api/documents');
    if (!resp.ok) return;
    const docs = await resp.json();
    const queue = document.getElementById('doc-queue');
    if (docs.length === 0) {
        queue.innerHTML = '<p class="text-sm text-gray-500">No documents</p>';
        return;
    }
    queue.innerHTML = docs.map(d => `
        <div class="border rounded-lg p-3 hover:bg-gray-50 cursor-pointer" onclick="selectDoc(${d.id})">
            <div class="flex justify-between items-center mb-2">
                <span class="font-medium text-sm">${d.original_filename}</span>
                <span class="text-xs px-2 py-1 rounded-full bg-gray-100">${d.status}</span>
            </div>
            <div class="flex gap-2 mt-2">
                <button onclick="event.stopPropagation(); doAction(${d.id}, 'submit_review')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">Submit Review</button>
                <button onclick="event.stopPropagation(); doAction(${d.id}, 'approve')" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200">Approve</button>
                <button onclick="event.stopPropagation(); doAction(${d.id}, 'reject')" class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded hover:bg-red-200">Reject</button>
                <button onclick="event.stopPropagation(); doAction(${d.id}, 'request_changes')" class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded hover:bg-yellow-200">Changes</button>
            </div>
        </div>
    `).join('');
}

function selectDoc(docId) {
    selectedDocId = docId;
    loadHistory(docId);
}

async function loadHistory(docId) {
    const resp = await authFetch(`/api/documents/${docId}/workflow`);
    if (!resp.ok) return;
    const entries = await resp.json();
    const hist = document.getElementById('workflow-history');
    if (entries.length === 0) {
        hist.innerHTML = '<p class="text-sm text-gray-500">No workflow history for this document</p>';
        return;
    }
    hist.innerHTML = entries.map(e => `
        <div class="flex items-start gap-3 py-2 border-b last:border-0">
            <span class="inline-block w-3 h-3 mt-1 rounded-full ${actionColor(e.action)}"></span>
            <div>
                <p class="text-sm font-medium">${e.action.replace('_', ' ')}</p>
                <p class="text-xs text-gray-500">${e.comment || 'No comment'}</p>
                <p class="text-xs text-gray-400">${new Date(e.created_at).toLocaleString()}</p>
            </div>
        </div>
    `).join('');
}

function actionColor(action) {
    const colors = {
        submit_review: 'bg-blue-500',
        approve: 'bg-green-500',
        reject: 'bg-red-500',
        request_changes: 'bg-yellow-500'
    };
    return colors[action] || 'bg-gray-500';
}

async function doAction(docId, action) {
    const comment = prompt('Add a comment (optional):');
    const resp = await authFetch(`/api/documents/${docId}/workflow/${action}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ comment: comment || null })
    });
    if (resp.ok) {
        loadHistory(docId);
    }
}

loadQueue();
</script>
{% endblock %}
