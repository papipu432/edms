<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-8">
                    <a href="/dashboard" class="text-xl font-bold text-blue-600">EDMS</a>
                    <a href="/dashboard" class="text-gray-600 hover:text-gray-900">Dashboard</a>
                    <a href="/workflow" class="text-gray-600 hover:text-gray-900">Workflow</a>
                    <a href="/admin/users" class="text-gray-600 hover:text-gray-900">Admin</a>
                    <a href="/settings/llm" class="text-gray-600 hover:text-gray-900">Settings</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-info" class="text-sm text-gray-600"></span>
                    <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800">Logout</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
    <script>
        const token = localStorage.getItem('edms_token');
        function logout() {
            localStorage.removeItem('edms_token');
            window.location.href = '/login';
        }
        function authFetch(url, options = {}) {
            options.headers = options.headers || {};
            if (token) options.headers['Authorization'] = 'Bearer ' + token;
            return fetch(url, options);
        }
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
