[project]
name = "edms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.0.0",
    "openai>=2.38.0",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.3",
    "pikepdf>=10.7.2",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.29",
    "sqlalchemy[asyncio]>=2.0.50",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.48.0",
]

# Note: marker-pdf and docling have version conflicts with pillow>=12.
# They cannot be installed in the current environment but the code handles
# their absence gracefully via try/except imports. Install them manually
# in environments with compatible pillow versions.

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
