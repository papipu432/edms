# Fail2Ban filter for EDMS authentication failures
# Detects failed login attempts and unauthorized access
# Copy to /etc/fail2ban/filter.d/edms-auth.conf

[Definition]
# Match failed authentication attempts
failregex = ^<HOST> -.*"(POST)\s(/api/auth/|/api/v1/auth/|/login|/auth/login)[^"]*\sHTTP/[^"]*"\s401\s
            ^<HOST> -.*"(POST)\s(/api/auth/|/api/v1/auth/|/login|/auth/login)[^"]*\sHTTP/[^"]*"\s403\s
            ^<HOST> -.*"(GET)\s(/api/auth/|/api/v1/auth/|/login)[^"]*\sHTTP/[^"]*"\s401\s
            ^<HOST> -.*"-(POST|GET)\s.*(/auth|/login).*HTTP/[^"]*"\s(401|403)$
ignoreregex =
# Enable DNS lookups (set to false for performance)
dns = False
# Date pattern for log parsing
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S\s%%z
