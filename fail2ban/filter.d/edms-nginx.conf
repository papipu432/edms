# Fail2Ban filter for EDMS Nginx access logs
# Detects HTTP 4xx and 5xx errors indicating potential abuse
# Copy to /etc/fail2ban/filter.d/edms-nginx.conf

[Definition]
# Match requests resulting in client or server errors
failregex = ^<HOST> -.*"(GET|POST|PUT|DELETE|PATCH)\s[^"]*\sHTTP/[^"]*"\s(4\d{2}|5\d{2})\s
            ^<HOST> -.*"-(GET|POST|PUT|DELETE|PATCH)\s[^"]*\sHTTP/[^"]*"\s(4\d{2}|5\d{2})$
ignoreregex =
# Enable DNS lookups (set to false for performance)
dns = False
# Date pattern for log parsing
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S\s%%z
