# Fail2Ban filter for EDMS scanner endpoint abuse
# Detects unauthorized scanner access attempts
# Copy to /etc/fail2ban/filter.d/edms-scanner.conf

[Definition]
# Match scanner endpoint abuse
failregex = ^<HOST> -.*"(GET|POST)\s(/api/scanner/|/api/v1/scanner/|/scanner)[^"]*\sHTTP/[^"]*"\s(4\d{2}|5\d{2})\s
            ^<HOST> -.*"-(GET|POST)\s.*(/scanner).*HTTP/[^"]*"\s(4\d{2}|5\d{2})$
ignoreregex =
# Enable DNS lookups (set to false for performance)
dns = False
# Date pattern for log parsing
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S\s%%z
