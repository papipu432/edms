# Fail2Ban filter for EDMS upload abuse
# Detects excessive upload attempts
# Copy to /etc/fail2ban/filter.d/edms-upload.conf

[Definition]
# Match rapid upload requests
failregex = ^<HOST> -.*"(POST|PUT)\s(/api/upload/|/api/v1/upload/|/upload)[^"]*\sHTTP/[^"]*"\s(2\d{2}|4\d{2})\s
            ^<HOST> -.*"-(POST|PUT)\s.*(/upload).*HTTP/[^"]*"\s(2\d{2}|4\d{2})$
ignoreregex =
# Enable DNS lookups (set to false for performance)
dns = False
# Date pattern for log parsing
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S\s%%z
